meta:
  data_dir: "../data"
  experiment_name: null

preprocessing:
  imgsz: 512
  train_data_ratio: 1.0
  seed: 42

training:
  epochs: 10
  patience: 8
  batch_size: 4
  val_ratio: 0.2
  test_ratio: 0.2
  val_interval: 1
  warmup_epochs: 4
  resume: false

model:
  model_name: "MobileUNetV3S"
  num_classes: 2
  freeze_backbone_epochs: 0
  dropout: 0.0
  embedding_mode: "center-seed"

optimizer:
  type: "AdamW"
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9
  backbone_lr_mult: 3.0
